<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="House rules: data model first, thin controllers, validate at the edge"><title>House rules: data model first, thin controllers, validate at the edge</title><defs></defs><rect x="12" y="12" width="884" height="290" fill="#171412" stroke="none" stroke-width="0"/><rect x="4" y="4" width="884" height="290" fill="#F3EAD3" stroke="#171412" stroke-width="4"/><rect x="30" y="22" width="42" height="42" fill="#E4472B" stroke="#171412" stroke-width="3"/><text x="51" y="53" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#F3EAD3" text-anchor="middle" >1</text><text x="92" y="52" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="#171412" text-anchor="start" >DATA MODEL FIRST. UI SECOND.</text><line x1="30" y1="71" x2="858" y2="71" stroke="#171412" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/><rect x="30" y="76" width="42" height="42" fill="#F2B632" stroke="#171412" stroke-width="3"/><text x="51" y="107" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#171412" text-anchor="middle" >2</text><text x="92" y="106" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="#171412" text-anchor="start" >THIN CONTROLLERS. FAT SERVICES.</text><line x1="30" y1="125" x2="858" y2="125" stroke="#171412" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/><rect x="30" y="130" width="42" height="42" fill="#2F7A5C" stroke="#171412" stroke-width="3"/><text x="51" y="161" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#F3EAD3" text-anchor="middle" >3</text><text x="92" y="160" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="#171412" text-anchor="start" >VALIDATE EVERYTHING AT THE EDGE.</text><line x1="30" y1="179" x2="858" y2="179" stroke="#171412" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/><rect x="30" y="184" width="42" height="42" fill="#F4A48E" stroke="#171412" stroke-width="3"/><text x="51" y="215" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#171412" text-anchor="middle" >4</text><text x="92" y="214" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="#171412" text-anchor="start" >MAKE IT FEEL GOOD BEFORE CALLING IT DONE.</text><line x1="30" y1="233" x2="858" y2="233" stroke="#171412" stroke-width="2" stroke-dasharray="6 6" opacity=".35"/><rect x="30" y="238" width="42" height="42" fill="#B9D5BF" stroke="#171412" stroke-width="3"/><text x="51" y="269" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="24" font-weight="900" fill="#171412" text-anchor="middle" >5</text><text x="92" y="268" font-family="'Arial Black','Arial Bold',Impact,Helvetica,Arial,sans-serif" font-size="20" font-weight="900" fill="#171412" text-anchor="start" >SIDE PROJECTS GET THE PROD TREATMENT.</text></svg>